          $ref: '#/components/schemas/Money'
        annualizedSpend:
          $ref: '#/components/schemas/Money'
        subscriptionCount:
          type: integer
          title: Subscriptioncount
        candidateCount:
          type: integer
          title: Candidatecount
        openFindingsCount:
          type: integer
          title: Openfindingscount
        potentialSavings:
          $ref: '#/components/schemas/Money'
        userEstimatedSavings:
          $ref: '#/components/schemas/Money'
        upcoming:
          items:
            $ref: '#/components/schemas/UpcomingItem'
          type: array
          title: Upcoming
        recentChanges:
          items:
            $ref: '#/components/schemas/RecentChangeItem'
          type: array
          title: Recentchanges
        spendByCategory:
          items:
            $ref: '#/components/schemas/SpendByCategoryItem'
          type: array
          title: Spendbycategory
