[project]
name = "subtracker-backend"
version = "0.1.0"
description = "FastAPI backend for Hidden B2B Subscriptions & Waste Tracker"
readme = "README.md"
authors = [
    { name = "Solikh228", email = "240103008@sdu.edu.kz" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
