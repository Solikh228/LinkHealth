apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    uid: prometheus-subtracker

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    uid: loki-subtracker
    jsonData:
      derivedFields:
        - datasourceUid: tempo-subtracker
          matcherRegex: '"trace_id":\s*"([0-9a-fA-F]+)"|trace_id=([0-9a-fA-F]+)|traceID=([0-9a-fA-F]+)'
          name: TraceID
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    uid: tempo-subtracker
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki-subtracker
        tags: ['service.name', 'deployment.environment.name', 'service.version']
        filterByTraceID: true
        filterBySpanID: false
      serviceMap:
        datasourceUid: prometheus-subtracker
      search:
        hide: false
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki-subtracker
